---
  # xorg options
  xorg_options_dpi: 96
  xorg_options_init_order_monitors:
  - center
  - top
  - left
  - right
  xorg_options_init_order_videocards:
  - first

  xorg:
    videocards:
      first:
        vendor: "NVidia Corporation"
        model: "GeForce RTX 3070 Ti"
        driver: "nvidia"
        pci: "01:00.0"
    monitors:
      center:
        vendor: "LG"
        model: "27UL500-W"
        connector:
          card: first
          out: "DP-2"
        position:
          base: yes
        mode:
          width: 3840
          height: 2160
          rate: 60
      left:
        vendor: "Iiyama"
        model: "ProLite XU2395WSU-B1"
        connector:
          card: first
          out: "DP-4"
        position:
          where: left-of
          from: center
        mode:
          width: 1920
          height: 1200
          rate: 75
        rotate: right
      right:
        vendor: "Iiyama"
        model: "ProLite XU2395WSU-B1"
        connector:
          card: first
          out: "DP-0"
        position:
          where: right-of
          from: center
        mode:
          width: 1920
          height: 1200
          rate: 75
        rotate: left
      top:
        vendor: "LG"
        model: "22MP55"
        connector:
          card: first
          out: "HDMI-0"
        position:
          where: above
          from: center
        mode:
          width: 1920
          height: 1080
          rate: 60
