---
  # xorg options
  xorg_options_dpi: 96
  xorg_options_init_order_monitors:
  - left
  - right
  xorg_options_init_order_videocards:
  - first

  xorg:
    videocards:
      first:
        vendor: "NVidia Corporation"
        model: "GeForce GTX 630 (GF108)"
        driver: "nouveau"
        pci: "01:00.0"
    monitors:
      left:
        vendor: "LG"
        model: "L1740PQ"
        connector:
          card: first
          out: "DVI-I-1"
        position:
          base: yes
        mode:
          width: 1280
          height: 1024
          rate: 60
      right:
        vendor: "LG"
        model: "L1740PQ"
        connector:
          card: first
          out: "VGA-1"
        position:
          where: right-of
          from: left
        mode:
          width: 1280
          height: 1024
          rate: 60
